# Builds release packages for Linux (.tar.xz and .tar.gz), Windows (.zip) and macOS (.dmg)
# and attaches them to a GitHub Release.
#
# How to use:
#   * push a tag such as v0.2.0-ru   ->  a Release with all packages is created;
#   * or run it by hand: Actions ▸ Release ▸ Run workflow (packages appear as artifacts).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev xz-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: cargo xtask package ${{ matrix.target }}
      - name: Also make a .tar.xz (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          cd dist/linux
          for d in */; do d=${d%/}; tar -cJf "../$d.tar.xz" "$d"; done
          cd ..
          for f in *.tar.xz; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: plancraft-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
